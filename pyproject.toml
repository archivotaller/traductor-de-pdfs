[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptr"
version = "0.1.0"
description = "Traductor local de PDF académicos EN -> ES"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Diego" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
fast-engine = [
    "ctranslate2>=4.0.0",
    "transformers>=4.38.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
ptr = "ptr.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
